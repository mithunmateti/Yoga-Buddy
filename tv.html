<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yoga Buddy on TV</title>
  <link rel="icon" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <!-- The TV screen: the big coach view, filled in by tv.js from the
       phone or laptop that is casting (cast.js) -->
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0F1A1A;
      color: #FFFFFF;
      font-family: "Plus Jakarta Sans", "Segoe UI", Arial, sans-serif;
      overflow: hidden;
    }

    .tv {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 3vw;
      height: 100%;
      padding: 4vh 4vw;
      box-sizing: border-box;
    }

    .stage {
      position: relative;
      background: radial-gradient(circle at 50% 40%, #1E3230 0%, #0A1313 75%);
      border-radius: 3vh;
      overflow: hidden;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .side {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4vh;
    }

    .brand {
      margin: 0;
      color: #5FD394;
      font-size: 2.4vh;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 6vh;
      font-weight: 800;
      line-height: 1.1;
    }

    .score {
      margin: 0;
      font-size: 16vh;
      font-weight: 800;
      line-height: 1;
    }

    .score small {
      font-size: 5vh;
      color: #9AABA8;
    }

    .tip {
      margin: 0;
      font-size: 4.2vh;
      font-weight: 700;
      line-height: 1.25;
    }

    .tip.good {
      color: #5FD394;
    }

    .coach,
    .timer {
      margin: 0;
      color: #9AABA8;
      font-size: 3vh;
      font-weight: 600;
    }

    .waiting {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2vh;
      background: #0F1A1A;
      text-align: center;
    }

    .waiting img {
      width: 14vh;
      border-radius: 3vh;
    }

    .waiting p {
      max-width: 60vw;
      margin: 0;
      color: #9AABA8;
      font-size: 3vh;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="waiting" class="waiting">
    <img src="images/icon-512.png" alt="">
    <h1>Yoga Buddy</h1>
    <p id="waiting-text">Open Yoga Buddy on your phone or laptop, choose a pose and press 📺 to show it here.</p>
  </div>

  <main class="tv">
    <div class="stage"><canvas id="tv-skeleton"></canvas></div>
    <div class="side">
      <p class="brand">Yoga Buddy</p>
      <h1 id="tv-pose"></h1>
      <p class="score"><span id="tv-score">–</span><small>/100</small></p>
      <p id="tv-timer" class="timer"></p>
      <p id="tv-tip" class="tip"></p>
      <p id="tv-coach" class="coach"></p>
    </div>
  </main>

  <script src="tv.js?v=20261123b"></script>
</body>
</html>
